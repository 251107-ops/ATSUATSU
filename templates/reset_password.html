<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="login-box">
    <h2>新しいパスワードの設定</h2>
    <p style="font-size: 0.85em; color: #666; margin-bottom: 15px;">新しいパスワードを入力してください。</p>

    {% if error_message %}
        <p class="error" style="color: red; font-size: 0.9em;">{{ error_message }}</p>
    {% endif %}

    <form action="{{ url_for('auth.reset_password') }}" method="POST">
        <input type="hidden" name="user_id" value="{{ user_id }}">

        <label>新しいパスワード</label>
        <input type="password" name="password" placeholder="新しいパスワード" required>

        <label>新しいパスワード（確認）</label>
        <input type="password" name="password_confirm" placeholder="もう一度入力してください" required>

        <input type="submit" value="パスワードを変更する" class="login-btn" style="margin-top: 15px;">
    </form>
</div>
</body>
</html>
