<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - メール入力</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="login-box">
    <h2>パスワード再設定</h2>
    <p style="font-size: 0.9em; color: #666;">登録しているメールアドレスを入力してください。</p>

    {% if error_message %}
        <p class="error" style="color: red;">{{ error_message }}</p>
    {% endif %}

    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <label>メールアドレス</label>
        <input type="email" name="email" placeholder="example@mail.com" required>

        <input type="submit" value="認証コードを発行" class="login-btn">
    </form>

    <div class="signup" style="margin-top: 15px;">
        <a href="/login">ログイン画面に戻る</a>
    </div>
</div>
</body>
</html>
