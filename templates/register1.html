<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink 新規登録 (1/2)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-box">

    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SkillLink" class="logo">

    <form method="POST" action="/register1">
        <p style="color:red">{{error_message}}</p>
        
        <label>氏名</label>
        <input type="text" name="name" placeholder="氏名を入力してください" required>

        <label>メールアドレス</label>
        <input type="text" name="email" placeholder="メールアドレス" required>

        <label>パスワード</label>
        <input type="password" id="password1" name="password" placeholder="パスワード" required>

        <label>パスワード確認</label>
        <input type="password" id="password2" name="password_confirm" placeholder="パスワード確認" required>

        <input type="submit" value="次のページへ" class="login-btn" onclick="pass_confirm(event)">

    </form>

    <div class="or">
        <span></span>
        OR
        <span></span>
    </div>

    <div class="signup">
        アカウントをお持ちですか？
        <a href="/login">ログイン画面へ</a>
    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
