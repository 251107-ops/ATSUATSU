<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/like_page.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
</head>
<body>
    {% include 'header.html' %}

    <div class="cards">
                {% for post in posts %}
                <div class="card">
                    <div class="card-top">
                        <img src="{{ url_for('static', filename=post.icon_path) }}" alt="ユーザーアバター">
                        <div>
                            <span class="name">{{ post.name }}</span>
                            <span class="meta">{{ post.department }} {{ post.grade }}</span>
                        </div>
                    </div>
                    <div class="tags">
                        <span class="tag">{{ post.category_name }}</span>
                        <span class="tag">{{ post.skill_name }}</span>
                        <span class="badge {{ 'teach' if post.post_type == '教えたい' else 'learn' }}">{{ post.post_type }}</span>
                    </div>
                    <p class="body">{{ post.post_text }}</p>
                    <form action="/posts/likes" method="POST">
                        <input type="hidden" name="post_id" value="{{ post.post_id }}">
                        <button type="submit" class="like-btn">{{post.like_count}}♥</button>
                    </form>
                    <!-- <span class="fav">{{ post.likes }} ♥</span> -->
                </div>
                {% else %}
                <div class="no-posts">
                    <p>該当する投稿はまだありません。</p>
                </div>
                {% endfor %}
            </div>
</body>
</html>
