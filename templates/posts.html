<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿作成 | スキルシェア</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/posts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
</head>
<body>
    {% include 'header.html' %}

    <div class="page-wrap">

        <div class="post-card">
            <h2>新規投稿作成</h2>
            <form method="POST" action="/posts">

                <!-- 募集タイプ -->
                <div class="form-group">
                    <p>募集タイプを選択してください：</p>
                    <select name="post_type">
                        <option value="教えたい" {{ 'selected' if preset_type == '教えたい' }}>教えたい</option>
                        <option value="学びたい" {{ 'selected' if preset_type == '学びたい' }}>学びたい</option>
                    </select>
                </div>

                <!-- カテゴリ選択（JSの連動とサーバー送信を兼用） -->
                <div class="form-group">
                    <p>カテゴリを選択してください：</p>
                    <select id="category_select" name="category_id" required>
                        <option value="">-- カテゴリを選択してください --</option>
                        {% for category in categories %}
                            <option value="{{ category[0] if category is iterable else category.category_id }}">{{ category[1] if category is iterable else category.category_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- スキル選択（カテゴリ連動で動的に変わる） -->
                <div class="form-group">
                    <p>対応するスキルを選択してください：</p>
                    <select id="skill_select" name="skill_id" required>
                        <option value="">-- 先にカテゴリを選んでください --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <p>ここに投稿内容を入力してください。</p>
                    <textarea name="post_text" rows="8" placeholder="投稿内容を入力" required></textarea>
                </div>

                <button type="submit" class="btn-submit">投稿する</button>
            </form>
        </div>

        <!-- 新規スキル追加カード -->
        <div class="skill-add-card">
            <h2>新しいスキルをシステムに追加</h2>
            <form method="POST" action="/skill_edit">
                <p>選択肢にないスキルを追加したい場合はここに入力してください：</p>
                <div class="skill-add-row">
                    <input type="text" name="skill_name" placeholder="例: Vue.js, Figma" required>
                    <button type="submit" class="btn-outline-small">スキルを登録</button>
                </div>
            </form>
        </div>

        <!-- 新規カテゴリ追加カード -->
        <div class="skill-add-card">
            <h2>新しいカテゴリをシステムに追加</h2>
            <form method="POST" action="/categories-add">
                <p>選択肢にないカテゴリを追加したい場合はここに入力してください：</p>
                <div class="category-add-row">
                    <input type="text" name="category_name" placeholder="例: Programming, IT" required>
                    <button type="submit" class="btn-outline-small">カテゴリを登録</button>
                </div>
            </form>
        </div>

    </div>

    {% include 'footer.html' %}

    <script>
        // サーバーから渡された全スキルデータ
        const allSkills = [
            {% for s in skills %}
            { id: {{ s.skill_id }}, name: "{{ s.skill_name }}", categoryId: {{ s.category_id if s.category_id else 'null' }} },
            {% endfor %}
        ];

        document.getElementById('category_select').addEventListener('change', function() {
            const categoryId = parseInt(this.value);
            const skillSelect = document.getElementById('skill_select');
            
            // スキル選択肢をいったんリセット
            skillSelect.innerHTML = '';

            if (!categoryId) {
                skillSelect.innerHTML = '<option value="">-- 先にカテゴリを選んでください --</option>';
                return;
            }

            // 選択されたカテゴリに一致するスキルをフィルタリング
            const filtered = allSkills.filter(s => s.categoryId === categoryId);

            if (filtered.length === 0) {
                skillSelect.innerHTML = '<option value="">-- このカテゴリにスキルがありません --</option>';
                return;
            }

            // 選択肢の初期メッセージを追加
            skillSelect.innerHTML = '<option value="">-- スキルを選択してください --</option>';
            
            // フィルタリングしたスキルをプルダウンに追加
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name;
                skillSelect.appendChild(opt);
            });
        });
    </script>
</body>
</html>
