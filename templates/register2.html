<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink 新規登録 (2/2)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-box">

    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SkillLink" class="logo">

    <form method="POST" action="/register2" enctype="multipart/form-data">
        <input type="hidden" name="name" value="{{ name }}">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="password" value="{{ password }}">

        <label>学年</label>
        <div class="select-wrapper">
            <select name="grade" required>
                <option value="">選択してください</option>
                <option value="2">2年</option>
                <option value="3">3年</option>
            </select>
        </div>

        <label>学科</label>
        <div class="select-wrapper">
            <select name="department" required>
                <option value="">選択してください</option>
                <option value="情報システム">情報システム</option>
                <option value="その他">その他</option>
            </select>
        </div>

        <label>自己紹介</label>
        <textarea name="introduction" placeholder="自己紹介を入力してください（趣味や特技など）" rows="3"></textarea>

        <label>アイコン（任意）</label>
        <label class="file-upload-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>画像ファイルをアップロード</span>
            <input type="file" name="icon" accept="image/*">
        </label>

        <input type="submit" value="登録" class="login-btn">

    </form>

    <div class="or">
        <span></span>
        OR
        <span></span>
    </div>

    <div class="signup">
        <a href="/register1" class="back-link">← 前のページへ戻る</a>
    </div>

</div>

</body>
</html>
