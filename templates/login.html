<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink ログイン</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-box">

    <img src="{{ url_for('static', filename='img/logo.png') }}"
         alt="SkillLink"
         class="logo">

    {% if error_message %}
        <p class="error">{{ error_message }}</p>
    {% endif %}

    <form method="POST">
        <label>メールアドレス</label>
        <input
            type="text"
            name="email"
            placeholder="メールアドレス"
            value="{{ email }}">

        <label>パスワード</label>
        <input
            type="password"
            name="password"
            placeholder="パスワード">

        <a href="#" class="forgot">パスワードを忘れましたか？</a>

        <input
            type="submit"
            value="ログイン"
            class="login-btn">

    </form>

    <div class="or">
        <span></span>
        OR
        <span></span>
    </div>

    <div class="signup">
        アカウントをお持ちでないですか？
        <a href="/register1">新規登録</a>
        <!-- <a href="/top">トップ</a> -->
    </div>

</div>

</body>
</html>
