<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
</head>
<body>

<h1>ログイン画面</h1>

{% if error_message %}
<p style="color:red">{{ error_message }}</p>
{% endif %}

<form method="POST">
    <table border="1">
        <tr>
            <th>メールアドレス</th>
            <td>
                <input type="text" name="email" value="{{ email }}">
            </td>   
        </tr>
        <tr>
            <th>パスワード</th>
            <td>
                <input type="password" name="password">
            </td>                 
        </tr>
    </table>
    <br>
    <input type="submit" value="ログイン">
</form>

<br>
<a href="/register1" role="button">新規ユーザ登録</a>

</body>
</html>
