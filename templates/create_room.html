<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink - ルーム作成</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; margin: 0; padding: 20px; background: #fafafa; }
        .form-container { max-width: 500px; margin: 60px auto; background: white; padding: 30px; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #5c6bc0; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #555; font-size: 14px; }
        select { padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; background: #fdfdfd; width: 100%; box-sizing: border-box; }
        
        .type-selector { display: flex; gap: 10px; margin-top: 5px; }
        .btn-type { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ccc; 
            background: #f5f5f5; 
            color: #666; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.2s; 
        }
        .btn-type.active { 
            background: #5c6bc0; 
            color: white; 
            border-color: #4758b3; 
        }

        .btn-submit { width: 100%; padding: 12px; background: #5c6bc0; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 15px; }
        .btn-submit:hover { background: #4758b3; }
        .note { font-size: 13px; color: #777; margin-top: 10px; line-height: 1.4; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #5c6bc0; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    {% include 'header.html' %}
    <div class="form-container">
        <h2>新しいチャットルームを作成</h2>
        
        <!-- group_chatのグループ作成処理へ送信 -->
        <form id="create-room-form" action="{{ url_for('group_chat.create_group') }}" method="POST">
            <div class="form-group">
                <label for="skill-select">ルームのテーマを選択</label>
                <select id="skill-select" name="skill_id" required>
                    <option value="" disabled selected>カテゴリーを選択してください...</option>
                    {% for skill in skills %}
                        <option value="{{ skill.skill_id }}">{{ skill.skill_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>ルームの公開設定</label>
                <div class="type-selector">
                    <button type="button" class="btn-type active" id="btn-public" onclick="selectType('public')">公開ルーム</button>
                    <button type="button" class="btn-type" id="btn-private" onclick="selectType('private')">非公開ルーム</button>
                </div>
                <p class="note" id="type-description">公開ルームは一覧に表示され、誰でも自由に参加できます。</p>
            </div>

            <button type="submit" class="btn-submit">ルームを作成して開く</button>
        </form>

        <a href="{{ url_for('group_chat.group_chat_hub') }}" class="back-link">← キャンセルして戻る</a>
    </div>

    <script>
        let selectedType = 'public';

        function selectType(type) {
            selectedType = type;
            const btnPublic = document.getElementById('btn-public');
            const btnPrivate = document.getElementById('btn-private');
            const desc = document.getElementById('type-description');

            if (type === 'public') {
                btnPublic.classList.add('active');
                btnPrivate.classList.remove('active');
                desc.textContent = "公開ルームは一覧に表示され、誰でも自由に参加できます。";
            } else {
                btnPrivate.classList.add('active');
                btnPublic.classList.remove('active');
                desc.textContent = "非公開ルームは一覧に表示されません。参加するには招待コードが必要です。";
            }
        }

        document.getElementById('create-room-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const skillId = document.getElementById('skill-select').value;
            
            if (skillId) {
                // 公開設定（公開:1 / 非公開:0）を hidden input として追加して送信
                let typeInput = document.getElementById('is_public_input');
                if (!typeInput) {
                    typeInput = document.createElement('input');
                    typeInput.type = 'hidden';
                    typeInput.name = 'is_public';
                    typeInput.id = 'is_public_input';
                    this.appendChild(typeInput);
                }
                typeInput.value = selectedType === 'public' ? '1' : '0';

                this.submit();
            }
        });
    </script>
</body>
</html>
