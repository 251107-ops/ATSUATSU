<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillLink - プロジェクトを作成</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/create_room.css') }}">
</head>
<body>
    {% include 'header.html' %}

    <div class="form-container">
        <h2>プロジェクトを作成する</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert-container" style="margin-bottom: 20px;">
              {% for message in messages %}
                <div style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 6px; font-weight: bold;">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form id="project-form" method="POST" action="{{ url_for('projects_bp.new_project') }}">

            <div class="form-group">
                <label for="project_name">プロジェクト名</label>
                <input type="text" id="project_name" name="project_name" required>
            </div>

            <div class="form-group">
                <label for="description">説明</label>
                <input type="text" id="description" name="description" placeholder="どんなプロジェクトか入力してください" required>
            </div>

            <div class="form-group">
                <label for="recruit_count">募集人数（自分を含む）</label>
                <select id="recruit_count" name="recruit_count" required>
                    {% for n in range(2, 11) %}
                        <option value="{{ n }}" {{ 'selected' if n == 2 }}>{{ n }}人</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="category-select">ルームのカテゴリ選択</label>
                <select id="category-select" required>
                    <option value="" disabled selected>カテゴリーを選択してください...</option>
                    {% for category in categories %}
                        <option value="{{ category.category_id }}">{{ category.category_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="skill-select">ルームのスキル選択</label>
                <select id="skill-select" name="skill_id" required>
                    <option value="" disabled selected>-- 先にカテゴリを選んでください --</option>
                </select>
            </div>

            <div class="form-group">
                <label>ルームの公開状態を選択</label>
                <div class="type-selector">
                    <button type="button" class="btn-type active" id="btn-public" onclick="selectType('public')">公開</button>
                    <button type="button" class="btn-type" id="btn-private" onclick="selectType('private')">非公開</button>
                </div>
                <p class="note" id="type-description">公開ルームは一覧に表示され、誰でも参加申請できます。</p>
                <input type="hidden" id="is_public" name="is_public" value="public">
            </div>

            <button type="submit" class="btn-submit">決定して作成</button>
        </form>

        <a href="/" class="back-link">キャンセルして戻る</a>
    </div>

    <script>
        const allSkills = [
            {% for s in skills %}
            { id: "{{ s.skill_id }}", name: "{{ s.skill_name }}", categoryId: "{{ s.category_id }}" },
            {% endfor %}
        ];

        let selectedType = 'public';

        function selectType(type) {
            selectedType = type;
            document.getElementById('is_public').value = type;

            const btnPublic = document.getElementById('btn-public');
            const btnPrivate = document.getElementById('btn-private');
            const desc = document.getElementById('type-description');

            if (type === 'public') {
                btnPublic.classList.add('active');
                btnPrivate.classList.remove('active');
                desc.textContent = "公開ルームは一覧に表示され、誰でも参加申請できます。";
            } else {
                btnPrivate.classList.add('active');
                btnPublic.classList.remove('active');
                desc.textContent = "非公開ルームは一覧に表示されません。";
            }
        }

        function populateSkills(categoryId) {
            const skillSelect = document.getElementById('skill-select');
            skillSelect.innerHTML = '';

            if (!categoryId) {
                skillSelect.innerHTML = '<option value="" disabled selected>-- 先にカテゴリを選んでください --</option>';
                return;
            }

            const filtered = allSkills.filter(s => String(s.categoryId) === String(categoryId));

            if (filtered.length === 0) {
                skillSelect.innerHTML = '<option value="" disabled selected>-- このカテゴリにスキルがありません --</option>';
                return;
            }

            skillSelect.innerHTML = '<option value="" disabled selected>-- スキルを選択してください --</option>';
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name;
                skillSelect.appendChild(opt);
            });
        }

        document.getElementById('category-select').addEventListener('change', function() {
            populateSkills(this.value);
        });
    </script>

    {% include 'footer.html' %}
</body>
</html>
